<?xml version="1.0" encoding="utf-8"?>
<svg version="1.1" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48">
  <defs>
    <linearGradient id="aura-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#B8860B"/>
      <stop offset="50%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#B8860B"/>
    </linearGradient>
  </defs>
  <!-- charcoal background with rounded corners -->
  <rect width="48" height="48" rx="10" fill="#1A1815"/>
  <!-- outer ring -->
  <circle cx="24" cy="24" r="21" stroke="url(#aura-gold)" stroke-width="0.8" fill="none" opacity="0.4"/>
  <!-- inner seal ring -->
  <circle cx="24" cy="24" r="17" stroke="url(#aura-gold)" stroke-width="0.6" fill="none" opacity="0.25"/>
  <!-- The "A" — left stroke -->
  <path d="M24 11 L14 37" stroke="url(#aura-gold)" stroke-width="2.2" stroke-linecap="round" fill="none"/>
  <!-- The "A" — right stroke -->
  <path d="M24 11 L34 37" stroke="url(#aura-gold)" stroke-width="2.2" stroke-linecap="round" fill="none"/>
  <!-- crossbar of the A -->
  <path d="M18.5 28 L29.5 28" stroke="url(#aura-gold)" stroke-width="1.5" stroke-linecap="round"/>
  <!-- compass dot at apex -->
  <circle cx="24" cy="11" r="1.8" fill="url(#aura-gold)"/>
  <!-- base tick marks (atelier feel) -->
  <path d="M13 39 L35 39" stroke="url(#aura-gold)" stroke-width="0.6" stroke-linecap="round" opacity="0.5"/>
</svg>
